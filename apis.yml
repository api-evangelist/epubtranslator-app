aid: epubtranslator-app

name: EPUB Translator

image: https://epubtranslator.app/opengraph-image

description: EPUB Translator provides AI-powered translation of entire EPUB books, preserving chapters, footnotes, and layout. Users upload an
  EPUB or PDF and receive a fully translated version in the target language, with context-aware chapter translation and original formatting retained.
  The service targets readers, researchers, and learners who own foreign language books and need accurate, formatted translations for personal
  use.

